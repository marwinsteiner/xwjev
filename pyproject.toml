[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xwjev"
version = "0.1.0"
description = "Crossword solver: fine-tuned bi-encoder retrieval + Jev (TypeSafe System One) judging + belief propagation"
requires-python = ">=3.10"
license = { text = "Proprietary, all rights reserved (see LICENSE)" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "typesafe-sdk>=0.7",
    "httpx>=0.27",
    "wordninja>=2.0",
    "tqdm>=4.60",
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
    "accelerate>=1.1",
    "datasets>=2.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "xword-dl>=2024.1", "onnx>=1.15"]

[project.scripts]
xwjev = "xwjev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
